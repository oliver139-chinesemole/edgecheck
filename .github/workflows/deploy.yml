name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Skip re-triggering when only the built output changes
      - 'docs/**'
      - '**.md'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so git push works
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          # Set this secret in: GitHub repo → Settings → Secrets → Actions
          # Value: your Render backend URL, e.g. https://edgecheck.onrender.com
          # Leave it unset to build without a backend (Market Sim will show offline)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Commit docs/ and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to docs — skipping commit."
          else
            git commit -m "build: auto-deploy from ${{ github.sha }} [skip ci]"
            git push
          fi
